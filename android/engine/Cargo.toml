[package]
name = "screenshare-android"
version = "0.1.0"
description = "JNI bridge between the Android app (Kotlin) and the desktop's Rust engine"
edition = "2024"
publish = false

[lib]
name = "screenshare_android"
crate-type = ["cdylib"]

[dependencies]
desktop-native = { path = "../../desktop-native" }
# The same libwebrtc as the engine, for initialize_android_context.
libwebrtc = { git = "https://github.com/RafaelrainBR/rust-sdks.git", rev = "3f1ba6467fd6116c35d29389cd9d477340b92e4b", package = "libwebrtc" }
jni = "0.21"
serde = "1.0.228"
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["rt-multi-thread"] }
sentry = { version = "0.49.3", default-features = false, features = ["backtrace", "contexts", "panic", "logs", "ureq", "rustls"] }

[profile.release]
debug = "line-tables-only"

[build-dependencies]
# Exports libwebrtc's Java_livekit_org_webrtc_* from this .so (link args of a dependency do not reach the cdylib).
webrtc-sys-build = { git = "https://github.com/RafaelrainBR/rust-sdks.git", rev = "3f1ba6467fd6116c35d29389cd9d477340b92e4b", package = "webrtc-sys-build" }
