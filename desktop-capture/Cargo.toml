[package]
name = "desktop-capture"
version = "0.1.0"
description = "Screen, window and audio capture shared by the Screenshare desktop apps"
authors = ["Screenshare contributors"]
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "11", features = ["macos_14_0"] }

[target.'cfg(windows)'.dependencies]
wasapi = "0.26"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Dwm",
] }

[dev-dependencies]
serde_json = "1"
