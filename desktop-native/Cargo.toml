[package]
name = "desktop-native"
version = "0.1.0"
description = "Screenshare desktop client in Rust: iced UI, libwebrtc and the shared capture, no WebView"
edition = "2024"
publish = false

[features]
synthetic-test = []

[dependencies]
libwebrtc = { git = "https://github.com/livekit/rust-sdks.git", rev = "2ff180e403b33ac55caaf88639aaf6aa95cbb6fc", package = "libwebrtc" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "time"] }
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-native-roots"] }
futures-util = "0.3.34"
rand = "0.9.5"
iced = { version = "0.14", features = ["image", "svg", "tokio"] }
desktop-capture = { path = "../desktop-capture" }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Time", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Registry", "Win32_System_Threading", "Win32_Security"] }
tray-icon = "0.21"
image = { version = "0.25", default-features = false, features = ["png"] }
