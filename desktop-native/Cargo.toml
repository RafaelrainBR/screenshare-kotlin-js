[package]
name = "desktop-native"
version = "0.1.0"
description = "Screenshare desktop client in Rust: iced UI, libwebrtc and the shared capture, no WebView"
edition = "2024"
publish = false

[features]
synthetic-test = []

[dependencies]
# Fork at livekit 2ff180e plus set_volume on remote audio tracks (branch screenshare/remote-audio-volume).
libwebrtc = { git = "https://github.com/RafaelrainBR/rust-sdks.git", rev = "81434ab0f41ec1ebdae95881fb56a545acdaa4e7", package = "libwebrtc" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "time"] }
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-native-roots"] }
# wss:// needs exactly one rustls provider; ring only reaches libwebrtc's build script, not the app.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = "0.3.34"
rand = "0.9.5"
iced = { version = "0.14", features = ["image", "svg", "tokio"] }
desktop-capture = { path = "../desktop-capture" }
tray-icon = "0.21"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Time", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Registry", "Win32_System_Threading", "Win32_Security", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
# The macOS camera through AVFoundation; it also asks for the camera permission.
nokhwa = { version = "0.10.11", default-features = false, features = ["input-avfoundation"] }
