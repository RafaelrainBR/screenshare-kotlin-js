name: Dependency security

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test Kotlin, lint and package the server
        run: |
          chmod +x gradlew
          ./gradlew --build-cache --no-problems-report -Pkotlin.compiler.execution.strategy=in-process :client:jsTest :common:allTests :server:jvmTest :server-java:buildFatJar ktlintCheck
          node vendor/braces/test.cjs
          node --test scripts/build-presentation.test.mjs
          node scripts/build-presentation.mjs --check
      - name: Test the GLib backport with optimizations
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev
          glib_manifest=$(cargo metadata --locked --manifest-path desktop-tauri/src-tauri/Cargo.toml --format-version 1 | python3 -c 'import json, sys; print(next(p["manifest_path"] for p in json.load(sys.stdin)["packages"] if p["name"] == "glib"))')
          cargo test --manifest-path "$glib_manifest" --release --lib test_variant_str_iter
