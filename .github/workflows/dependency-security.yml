name: Dependency security

on:
  pull_request:
    # The Kotlin and server checks: nothing here builds the native app (native-check.yml does).
    paths-ignore:
      - desktop-native/**
      - docs/**
      - .github/workflows/native-check.yml
      - .github/workflows/release-native.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test Kotlin, lint and package the server
        run: |
          chmod +x gradlew
          ./gradlew --build-cache --no-problems-report -Pkotlin.compiler.execution.strategy=in-process :client:jsTest :common:allTests :server:jvmTest :server-java:buildFatJar ktlintCheck
          node vendor/braces/test.cjs
          node --test scripts/build-presentation.test.mjs
          node scripts/build-presentation.mjs --check
