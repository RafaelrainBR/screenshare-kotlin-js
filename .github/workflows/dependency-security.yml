name: Dependency security

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test Kotlin, lint and package the server
        run: |
          chmod +x gradlew
          ./gradlew --no-problems-report -Pkotlin.compiler.execution.strategy=in-process :client:jsTest :common:allTests :server:jvmTest :server-java:buildFatJar ktlintCheck
          node vendor/braces/test.cjs
      - name: Test the GLib backport with optimizations
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev
          cargo test --locked --manifest-path desktop-tauri/src-tauri/Cargo.toml -p glib --release --lib test_variant_str_iter
