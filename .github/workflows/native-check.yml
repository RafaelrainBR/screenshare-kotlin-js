name: Native check (macOS)

# The native app is developed and released on Windows; this keeps its macOS port compiling and
# tested on every change to it.
on:
  pull_request:
    branches: [master]
    paths:
      - desktop-native/**
      - desktop-capture/**
      - .github/workflows/native-check.yml
  # A pull request's cache is only visible to that pull request: this run saves the one that pull
  # requests and release-native.yml (dispatched on master) restore.
  push:
    branches: [master]
    paths:
      - desktop-native/**
      - desktop-capture/**
      - .github/workflows/native-check.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-check-${{ github.ref }}
  cancel-in-progress: true

env:
  # cargo's built-in git (libgit2 over SecureTransport on macOS) drops the libyuv submodule clone from
  # chromium.googlesource.com; the git CLI does not.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          # The same key as release-native.yml's macOS build.
          shared-key: native
          workspaces: |
            desktop-native -> target
            desktop-capture -> target
          save-if: ${{ github.event_name == 'push' }}
      - name: Test capture
        run: cargo test --release --locked --manifest-path desktop-capture/Cargo.toml
      - name: Test
        working-directory: desktop-native
        run: cargo test --release --locked
      - name: Build
        working-directory: desktop-native
        run: cargo build --release --locked
      - name: Import signing certificate
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
        run: bash desktop-native/scripts/import-macos-cert.sh
      # The same .app and tar.gz the release publishes, signed and verified.
      - name: Package
        run: bash desktop-native/scripts/bundle-macos.sh 0.0.0 "$RUNNER_TEMP/bundle" && ls -la "$RUNNER_TEMP/bundle"
