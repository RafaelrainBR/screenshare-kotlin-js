name: Native check (macOS)

# The native app is developed and released on Windows; this keeps its macOS port compiling and
# tested on every change to the native branch.
on:
  pull_request:
    branches: [native/desktop]
    paths:
      - desktop-native/**
      - desktop-capture/**
      - .github/workflows/native-check.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - name: Test capture
        run: cargo test --release --locked --manifest-path desktop-capture/Cargo.toml
      - name: Test
        working-directory: desktop-native
        run: cargo test --release --locked
      - name: Build
        working-directory: desktop-native
        run: cargo build --release --locked
