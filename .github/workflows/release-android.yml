name: Release Android

# android-vX.Y.Z[-rc.N]: a signed APK on GitHub Releases, ALWAYS --latest=false. "latest" belongs to
# the desktop: installed Tauri apps read releases/latest/download/latest.json. The tag push only
# dispatches this on master (like release-native.yml), where android-check.yml's cache lives.
on:
  push:
    tags: ['android-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: android-vX.Y.Z[-rc.N] (already pushed)
        required: true

permissions:
  contents: read

concurrency:
  group: release-android-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  NDK_VERSION: 28.2.13676358
  # Without a token the release still ships, with unsymbolicated frames.
  SENTRY_UPLOAD: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}

jobs:
  dispatch:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-android.yml --repo "$GITHUB_REPOSITORY" --ref master -f tag="$TAG"

  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Check tag
        run: '[[ "$TAG" =~ ^android-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)(-rc\.([1-9]|[1-8][0-9]|9[0-8]))?$ ]]'
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 21
      - name: Install the NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Install Rust
        working-directory: android/engine
        run: |
          rustup show active-toolchain || rustup toolchain install
          cargo install cargo-ndk --locked --version 4.1.2
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android
          workspaces: android/engine -> target
          save-if: false
      - uses: gradle/actions/setup-gradle@v5
      - name: Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SENTRY_DSN_ANDROID: ${{ secrets.SENTRY_DSN_ANDROID }}
        # Release ABIs: arm64 and the cheap 32-bit phones still sold in Brazil.
        run: ./gradlew --no-daemon -PappVersion="${TAG#android-v}" -Pabis=arm64-v8a,armeabi-v7a :app:testDebugUnitTest :app:assembleRelease
      - name: Verify signature and 16 KB alignment
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          bt="$ANDROID_HOME/build-tools/36.0.0"
          "$bt/zipalign" -c -P 16 -v 4 "$apk" | tail -1
          "$bt/apksigner" verify --print-certs "$apk" | grep -E "SHA-256|Signer #1 certificate DN"
          v=${TAG#android-v}
          mkdir -p release-assets
          cp "$apk" "release-assets/Screenshare-android_${v}.apk"
          cd release-assets && sha256sum * > SHA256SUMS && cat SHA256SUMS
      # Readable stack traces: the R8 mapping and the native symbols (Rust and libwebrtc).
      - name: Upload symbols to Sentry
        if: env.SENTRY_UPLOAD == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        # The unstripped .so (Gradle strips the packaged copy) and R8's mapping.
        run: |
          npx --yes @sentry/cli@2 debug-files upload --org screenshare-app --project screenshare-android --include-sources android/app/build/rust/jniLibs
          npx --yes @sentry/cli@2 upload-proguard --org screenshare-app --project screenshare-android android/app/build/outputs/mapping/release/mapping.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${TAG#android-v}
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          kind=(--latest=false)
          if [[ "$v" == *-* ]]; then kind+=(--prerelease); fi
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq 'select(.object.type == "tag") | .object.sha')
          changes=""
          if [ -n "$sha" ]; then
            changes=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .message | sed '1,/^$/d' | sed '/^-----BEGIN PGP/,$d')
          fi
          {
            if [[ "$v" == *-* ]]; then printf '> Versão de teste do app Android.\n\n'; fi
            if [ -n "$changes" ]; then printf '## O que mudou\n\n%s\n\n' "$changes"; fi
            printf '## Instalar\n\n'
            printf -- '- [Baixar o APK](%s/Screenshare-android_%s.apk) no celular (Android 10 ou mais novo) e abrir.\n' "$base" "$v"
            printf -- '- Na primeira vez, o Android pede para liberar "instalar apps desconhecidos" para o navegador.\n'
          } > notes.md
          gh release create "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            "${kind[@]}" --title "Screenshare Android $v" --notes-file notes.md
