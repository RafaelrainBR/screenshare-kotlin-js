name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release version (vX.Y.Z; app versions are updated automatically)
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Prepare release commit and tag
        id: source
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            git checkout --detach "$RELEASE_TAG"
          else
            node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          assert.match(process.env.RELEASE_TAG, /^v\d+\.\d+\.\d+$/);
          const version = process.env.RELEASE_TAG.slice(1);
          for (const name of ['package.json', 'package-lock.json', 'src-tauri/tauri.conf.json']) {
            const path = `desktop-tauri/${name}`;
            const data = JSON.parse(readFileSync(path, 'utf8'));
            data.version = version;
            if (name === 'package-lock.json') data.packages[''].version = version;
            writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
          }
          for (const [name, pattern] of [
            ['Cargo.toml', /(\[package\][\s\S]*?^version = ")[^"]+(")/m],
            ['Cargo.lock', /(name = "screenshare-desktop"\r?\nversion = ")[^"]+(")/],
          ]) {
            const path = `desktop-tauri/src-tauri/${name}`;
            const text = readFileSync(path, 'utf8');
            assert.match(text, pattern);
            writeFileSync(path, text.replace(pattern, (_, before, after) => before + version + after));
          }
          NODE
            git add desktop-tauri/package.json desktop-tauri/package-lock.json desktop-tauri/src-tauri/Cargo.toml desktop-tauri/src-tauri/Cargo.lock desktop-tauri/src-tauri/tauri.conf.json
            if ! git diff --cached --quiet; then
              git -c user.name='github-actions[bot]' -c user.email='github-actions[bot]@users.noreply.github.com' commit -m "chore: prepare release $RELEASE_TAG"
            fi
            git tag "$RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  test:
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ needs.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate release versions
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const tag = process.env.RELEASE_TAG;
          assert.match(tag, /^v\d+\.\d+\.\d+$/);
          const version = tag.slice(1);
          const read = path => readFileSync(`desktop-tauri/${path}`, 'utf8');
          const json = path => JSON.parse(read(path));
          assert.equal(json('package.json').version, version);
          assert.equal(json('package-lock.json').version, version);
          assert.equal(json('package-lock.json').packages[''].version, version);
          assert.equal(json('src-tauri/tauri.conf.json').version, version);
          assert.equal(read('src-tauri/Cargo.toml').match(/^version = "([^"]+)"/m)[1], version);
          assert.equal(read('src-tauri/Cargo.lock').match(/name = "screenshare-desktop"\r?\nversion = "([^"]+)"/)[1], version);
          NODE
      - name: Kotlin tests
        run: |
          chmod +x gradlew
          ./gradlew --no-problems-report -Pkotlin.compiler.execution.strategy=in-process :client:jsTest :common:allTests :server:jvmTest
          node vendor/braces/test.cjs

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            bundles: nsis,msi
          # apple-metal's Swift bridge requires the macOS 26 SDK.
          - os: macos-26
            platform: macos-arm64
            bundles: app
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.test.outputs.commit }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install build tools
        run: |
          rustup update stable --no-self-update
          rustup default stable
          npm ci --prefix desktop-tauri
          chmod +x gradlew
      - name: Build frontend and test native code
        run: |
          node desktop-tauri/scripts/build-frontend.mjs
          cargo test --locked --manifest-path desktop-tauri/src-tauri/Cargo.toml
      - name: Build desktop bundles
        working-directory: desktop-tauri
        run: npm run tauri -- build --bundles '${{ matrix.bundles }}' -- --locked
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path release-assets
          Copy-Item desktop-tauri/src-tauri/target/release/bundle/nsis/*.exe release-assets/
          Copy-Item desktop-tauri/src-tauri/target/release/bundle/msi/*.msi release-assets/
          $version = $env:RELEASE_TAG.Substring(1)
          Copy-Item desktop-tauri/src-tauri/target/release/screenshare-desktop.exe "release-assets/Screenshare_${version}_x64-portable.exe"
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          app=desktop-tauri/src-tauri/target/release/bundle/macos/Screenshare.app
          codesign --verify --deep --strict "$app"
          mkdir release-assets
          tar -czf release-assets/Screenshare-macos-arm64.tar.gz -C "$(dirname "$app")" Screenshare.app
          cp desktop-tauri/scripts/install-macos.sh release-assets/
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.test.outputs.commit }}
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.test.outputs.commit }}
        run: |
          if git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG"; then
            git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
          else
            test "$?" -eq 2
          fi
          test "$(find release-assets -type f | wc -l)" -eq 5
          cd release-assets
          sha256sum * > SHA256SUMS
          cd ..
          notes="docs/releases/$RELEASE_TAG.md"
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-state; then
            test "$(cat release-state)" = true
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          elif [ -f "$notes" ]; then
            gh release create "$RELEASE_TAG" release-assets/* --target "$RELEASE_COMMIT" --draft --title "Screenshare ${RELEASE_TAG#v}" --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" release-assets/* --target "$RELEASE_COMMIT" --draft --title "Screenshare ${RELEASE_TAG#v}" --generate-notes
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest
