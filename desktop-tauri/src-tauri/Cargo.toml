[package]
name = "screenshare-desktop"
version = "0.1.0"
description = "Windows desktop shell for the canonical Screenshare Kotlin/JS client"
authors = ["Screenshare contributors"]
edition = "2021"

[lib]
name = "screenshare_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasapi = "0.24"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
] }
