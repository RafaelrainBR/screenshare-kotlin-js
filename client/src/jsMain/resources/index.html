<!DOCTYPE html>
<html lang="pt-BR" data-theme="night">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compartilhamento de Tela</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@latest/dist/full.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Estilos customizados para a barra de rolagem (custom-scroll) */
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: hsl(var(--bc)); /* border color (DaisyUI) */
            border-radius: 3px;
            transition: background 0.2s;
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: hsl(var(--nc)); /* neutral color */ }

        /* Estilos de animação */
        @keyframes fade-in { "0%": { opacity: 0, transform: "translateY(10px)" }, "100%": { opacity: 1, transform: "translateY(0)" }}
        .animate-fade-in { animation: fade-in 0.5s ease forwards; }
        .pulse-ring { animation: pulse-wave 2s ease-in-out infinite; }
        @keyframes pulse-wave { 0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); } 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); } }
    </style>
</head>
<body class="bg-base-300 text-base-content antialiased h-screen flex flex-col overflow-hidden">

<div id="join-screen" class="min-h-screen flex items-center justify-center p-4">
    <div class="card w-full max-w-md shadow-2xl bg-base-100 hover:shadow-primary/50 transition-shadow duration-300 animate-fade-in">
        <div class="card-body">
            <div class="text-center">
                <h1 class="text-3xl font-bold text-primary">Screen Share</h1>
            </div>

            <form class="space-y-4" onsubmit="return false;">
                <div class="form-control">
                    <label class="label"><span class="label-text">Nome de usuário</span></label>
                    <label class="input-group">
                        <input type="text" id="username" placeholder="Digite seu nome" class="input input-bordered w-full" />
                    </label>
                </div>

                <div class="form-control">
                    <label class="label"><span class="label-text">Código da sala</span></label>
                    <label class="input-group">
                        <input type="text" id="roomId" placeholder="Deixe vazio para criar nova sala" class="input input-bordered w-full" />
                    </label>
                </div>

                <button type="button" id="joinBtn" class="btn btn-primary w-full mt-6 shadow-lg shadow-primary/40">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
                    </svg>
                    Entrar na Sala
                </button>
            </form>
        </div>
    </div>
</div>

<div id="app-screen" class="hidden flex-1 flex flex-col bg-base-200 overflow-hidden">
    <div class="navbar bg-base-100 shadow-xl z-50 flex-shrink-0">
        <div class="flex-1 pl-2">
            <div class="hidden sm:block">
                <span class="text-xl opacity-70">Sala:</span>
                <span class="font-bold text-primary" id="current-room-id"></span>
            </div>
        </div>

        <div class="flex-none gap-2">
            <div class="dropdown dropdown-end">
                <div tabindex="0" role="button" class="btn btn-ghost btn-sm normal-case shadow-lg">
                    Tema
                    <svg
                        width="12px"
                        height="12px"
                        class="inline-block h-2 w-2 fill-current opacity-60"
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 2048 2048"
                    ><path d="M1799 349l242 241-1017 1017L7 590l242-241 775 775 775-775z"></path>
                    </svg>
                </div>
                <ul tabindex="-1" class="dropdown-content menu p-4 shadow bg-base-100 rounded-box w-80">
                    <li>
                        <input
                        type="radio"
                        name="theme-dropdown"
                        class="theme-controller w-full btn btn-sm btn-block btn-ghost justify-start"
                        aria-label="Dracula"
                        value="dracula" />
                    </li>
                    <li>
                        <input
                        type="radio"
                        name="theme-dropdown"
                        class="theme-controller w-full btn btn-sm btn-block btn-ghost justify-start"
                        aria-label="Garden"
                        value="garden" />
                    </li>
                    <li>
                        <input
                        type="radio"
                        name="theme-dropdown"
                        class="theme-controller w-full btn btn-sm btn-block btn-ghost justify-start"
                        aria-label="Night"
                        value="night" />
                    </li>
                    <li>
                        <input
                        type="radio"
                        name="theme-dropdown"
                        class="theme-controller w-full btn btn-sm btn-block btn-ghost justify-start"
                        aria-label="Coffee"
                        value="coffee" />
                    </li>
                    <li>
                        <input
                        type="radio"
                        name="theme-dropdown"
                        class="theme-controller w-full btn btn-sm btn-block btn-ghost justify-start"
                        aria-label="Synthwave"
                        value="synthwave" />
                    </li>
                </ul>
            </div>
            <button id="shareScreenBtn" class="btn btn-primary btn-sm normal-case shadow-lg">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                </svg>
                <span class="hidden md:inline">Compartilhar</span>
            </button>
            <button id="stopSharingBtn" class="btn btn-error btn-sm normal-case hidden">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"/>
                </svg>
                <span class="hidden md:inline">Parar</span>
            </button>

            <button id="micToggle" class="btn btn-ghost btn-circle indicator">
                <svg id="micIcon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path id="micIconPath" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/>
                    <line id="micSlash" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" x1="4" y1="4" x2="20" y2="20"/>
                </svg>
                <span id="micStatus" class="indicator-item badge badge-error badge-xs"></span>
            </button>

            <div class="dropdown dropdown-end">
                <label tabindex="0" id="deviceSelectBtn" class="btn btn-ghost btn-circle">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                    </svg>
                </label>
                <ul tabindex="-1" id="deviceDropdown" class="dropdown-content menu p-4 shadow bg-base-100 rounded-box w-80">
                    <h3 class="text-sm font-semibold mb-3 border-b pb-2 border-base-content/20">Dispositivos de Áudio</h3>

                    <div class="space-y-4">
                        <div class="form-control">
                            <label class="label"><span class="label-text">Microfone</span></label>
                            <select id="inputDevices" class="select select-bordered select-sm">
                                <option disabled selected>Em breve...</option>
                            </select>
                        </div>

                        <div class="form-control">
                            <label class="label"><span class="label-text">Alto-falante</span></label>
                            <select id="outputDevices" class="select select-bordered select-sm">
                                <option disabled selected>Em breve...</option>
                            </select>
                        </div>
                    </div>
                </ul>
            </div>

            <button id="toggleSidebarBtn" class="btn btn-ghost btn-circle" onclick="document.getElementById('sidebar-chat').classList.toggle('hidden')">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>
        </div>
    </div>

    <div class="flex flex-col lg:flex-row flex-1 overflow-hidden">

        <div class="flex-1 p-4 lg:p-6 relative flex items-center justify-center bg-base-300 overflow-hidden">
            <div id="no-screen-message" class="hero-content text-center animate-fade-in">
                <div class="max-w-md">
                    <div class="mx-auto w-24 h-24 rounded-full bg-base-100 mb-6 flex items-center justify-center">
                        <svg class="w-12 h-12 text-base-content opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                        </svg>
                    </div>
                    <h3 class="text-2xl font-bold">Nenhuma tela compartilhada</h3>
                    <p class="py-6 text-base-content opacity-70">Inicie o compartilhamento para visualizar o conteúdo.</p>
                </div>
            </div>

            <div id="video-container" class="hidden h-full w-full rounded-xl shadow-2xl relative">
                <video id="screen-video" class="w-full h-full object-contain rounded-xl pointer-events-none" autoplay playsinline></video>

                <button id="fullscreenBtn"
                        class="btn btn-sm btn-circle absolute bottom-6 right-6 bg-base-300 backdrop-blur-sm opacity-70 hover:opacity-100 transition-opacity">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/>
                    </svg>
                </button>
            </div>
        </div>

        <div id="sidebar-chat" class="w-full lg:w-96 border-t lg:border-l border-base-content/20 flex flex-col bg-base-100/80 backdrop-blur-sm z-10 h-auto lg:h-full lg:overflow-y-hidden overflow-y-auto">

            <div class="border-b border-base-content/20 flex-shrink-0">
                <div class="p-3 bg-base-200 flex items-center justify-between text-sm font-semibold">
                    <span>👥 Participantes</span>
                    <span class="badge badge-primary" id="participant-count">0</span>
                </div>
                <ul id="user-list" class="menu p-2 max-h-48 lg:max-h-64 overflow-y-auto custom-scroll space-y-1"></ul>
            </div>

            <div class="flex-1 flex flex-col overflow-hidden min-h-0">
                <div class="p-3 bg-base-200 flex items-center text-sm font-semibold border-b border-base-content/20 flex-shrink-0">
                    💬 Chat
                </div>

                <div id="chat-messages" class="flex-1 p-4 overflow-y-auto custom-scroll space-y-3">
                </div>

                <div class="p-4 border-t border-base-content/20 bg-base-200 flex-shrink-0">
                    <div class="flex gap-2">
                        <input type="text" id="message-input"
                               placeholder="Digite sua mensagem..."
                               class="input input-bordered input-sm flex-1">
                        <button id="send-message-btn" class="btn btn-primary btn-sm btn-square">
                            <svg class="w-5 h-5 rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.1/socket.io.js"></script>
<script>
    const roomIdInput = document.getElementById('roomId');
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('roomId');
    if (roomId) roomIdInput.value = roomId;

    const observerOptions = {
        threshold: 0.1,
        rootMargin: '0px 0px -50px 0px'
    };

    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('revealed');
            }
        });
    }, observerOptions);

    document.querySelectorAll('.animate-fade-in').forEach(el => observer.observe(el));

    document.getElementById('message-input')?.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            document.getElementById('send-message-btn')?.click();
        }
    });
    document.getElementById('username')?.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            document.getElementById('roomId')?.focus();
        }
    });
    document.getElementById('roomId')?.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            document.getElementById('joinBtn')?.click();
        }
    });

    const video = document.getElementById("screen-video");

    video.addEventListener("pause", (e) => {
        video.play();
    });
    video.addEventListener("click", (e) => {
        e.preventDefault();
    });
</script>
<script src="clientApp.js"></script>
</body>
</html>
